<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Barcode Scanner</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #f8fafc;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
      }

      .app {
        width: min(100%, 720px);
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(1.4rem, 3vw, 2rem);
      }

      p {
        line-height: 1.5;
        color: #cbd5e1;
      }

      .camera-shell {
        border-radius: 16px;
        overflow: hidden;
        background: #020617;
        border: 1px solid rgba(148, 163, 184, 0.2);
        margin: 16px 0;
      }

      video {
        display: block;
        width: 100%;
        max-height: 60vh;
        background: #000;
      }

      .status,
      .result {
        margin-top: 14px;
        padding: 14px;
        border-radius: 12px;
        background: rgba(30, 41, 59, 0.9);
      }

      .result h2 {
        margin-top: 0;
        color: #f8fafc;
      }

      .result p {
        margin: 6px 0;
      }

      .muted {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Mobile Barcode Scanner</h1>
      <p>Point your phone camera at a Code 128 barcode. The app will look up the matching product from the local catalog.</p>

      <div class="camera-shell">
        <video id="video" autoplay playsinline muted></video>
      </div>

      <button id="startButton" type="button" style="padding: 10px 16px; border: none; border-radius: 999px; background: #38bdf8; color: #082f49; font-weight: 700; cursor: pointer; margin-top: 8px;">Start camera</button>

      <div id="status" class="status">Tap “Start camera” and allow camera access.</div>
      <div id="result" class="result">
        <p class="muted">Waiting for scan…</p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
